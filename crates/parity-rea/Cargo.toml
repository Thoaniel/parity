[package]
name = "parity-rea"
description = "Static analysis for Parity: executables, symbols, strings and disassembly for any architecture."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
capstone = "0.12"
cpp_demangle = "0.4"
goblin = "0.9"
object = { version = "0.36", default-features = false, features = ["read", "std", "compression"] }
regex = "1"
rustc-demangle = "0.1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
