[package]
name = "parity"
description = "Rewrite any program in Rust, prove it behaves the same, and swap it in seamlessly."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
parity-rea = { path = "../parity-rea" }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
toml = "0.8"
walkdir = "2"
